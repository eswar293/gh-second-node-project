name: gh-second-node-project-Deploy
on: push
jobs:
    Test:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: "24"
            - name: Install Depedencies
              run: npm ci
            - name: Run Unit Tests
              run: npm test

    Deploy:
        needs: Test
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: "24"
            - name: Install Depedencies
              run: npm ci
            - name: Run Unit Tests
              run: npm test
            - name: Deploying App
              run: echo "Deploy App .."

